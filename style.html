<style>
/* ========================================
   全体
   ======================================== */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  background: #f4f7fb;
  color: #0b1f3a;
  line-height: 1.6;
  overflow: hidden; /* ページ全体のスクロールを禁止（データ行のみスクロールさせる） */
}

.container {
  max-width: 100%;
  margin: 0;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh; /* モバイルのアドレスバー変動に対応 */
}

/* ========================================
   ヘッダー
   ======================================== */
.header {
  background: #244a73;
  color: #fff;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  flex: 0 0 auto; /* 上部固定 */
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.lineworks-logo {
  font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
  font-weight: 900;
  color: #ffffff;
  font-size: 20px;
  letter-spacing: 0.02em;
  white-space: nowrap;
}

.title {
  margin: 0;
  font-size: 22px;
  letter-spacing: .04em;
  font-weight: 600;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.portal-link {
  display: inline-block;
  font-size: 13px;
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid #1f9d55;
  background: #1f9d55;
  color: #fff;
  text-decoration: none;
  font-weight: 500;
}

.portal-link:hover {
  background: #177a43;
  border-color: #177a43;
  color: #fff;
  text-decoration: none;
}

.date-picker {
  display: flex;
  align-items: center;
  gap: 8px;
}

.date-picker label {
  font-size: 0.9rem;
}

.date-picker input[type="date"] {
  padding: 6px 12px;
  border: none;
  border-radius: 4px;
  font-size: 0.95rem;
  cursor: pointer;
}

/* ========================================
   保存ステータス
   ======================================== */
.save-status {
  padding: 6px 12px;
  border-radius: 4px;
  font-size: 0.85rem;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.3s ease;
}

.save-status-saved {
  background-color: rgba(76, 175, 80, 0.2);
  color: #c8e6c9;
  border: 1px solid rgba(76, 175, 80, 0.3);
}

.save-status-saving {
  background-color: rgba(33, 150, 243, 0.2);
  color: #bbdefb;
  border: 1px solid rgba(33, 150, 243, 0.3);
  animation: pulse 1.5s ease-in-out infinite;
}

.save-status-unsaved {
  background-color: rgba(255, 152, 0, 0.2);
  color: #ffe0b2;
  border: 1px solid rgba(255, 152, 0, 0.3);
}

.save-status-error {
  background-color: rgba(244, 67, 54, 0.2);
  color: #ffcdd2;
  border: 1px solid rgba(244, 67, 54, 0.3);
}

.save-status-offline {
  background-color: rgba(158, 158, 158, 0.2);
  color: #e0e0e0;
  border: 1px solid rgba(158, 158, 158, 0.3);
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* ========================================
   ボタン
   ======================================== */
.btn {
  padding: 8px 16px;
  border: none;
  border-radius: 4px;
  font-size: 0.9rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.2s ease;
}

.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.btn-secondary {
  background-color: rgba(255,255,255,0.2);
  color: white;
  border: 1px solid rgba(255,255,255,0.3);
}

.btn-secondary:hover:not(:disabled) {
  background-color: rgba(255,255,255,0.3);
}

.btn-danger {
  background-color: #d9534f;
  color: white;
}

.btn-danger:hover:not(:disabled) {
  background-color: #c9302c;
}

.btn-icon {
  font-size: 1.1em;
}

/* ========================================
   ステータスメッセージ
   ======================================== */
.status-message {
  padding: 12px 20px;
  margin: 0;
  font-size: 0.9rem;
  border-bottom: 1px solid rgba(0,0,0,0.1);
  flex: 0 0 auto; /* 固定 */
}

.status-message.success {
  background-color: #c6f6d5;
  color: #22543d;
}

.status-message.error {
  background-color: #fed7d7;
  color: #742a2a;
}

.status-message.info {
  background-color: #bee3f8;
  color: #2a4365;
}

.hidden {
  display: none !important;
}

/* ========================================
   ローディング
   ======================================== */
.loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px;
  gap: 16px;
  color: #666;
  background: #fff;
  flex: 0 0 auto; /* 固定 */
}

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid #e2e8f0;
  border-top-color: #3182ce;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ========================================
   テーブル：罫線を繋げる（重要）
   ======================================== */
.table-container {
  background: #fff;
  flex: 1 1 auto;  /* 残り高さをすべて使う */
  min-height: 0;   /* flex子要素がスクロール可能になるために必須 */
  overflow: auto;  /* データ行をここで縦横スクロール */
}

.outing-table {
  width: 100%;
  border-collapse: collapse;  /* ←隙間ゼロ */
  table-layout: fixed;
  background: #fff;
}

.outing-table th,
.outing-table td {
  border: 1px solid #c9d4e3;
  padding: 0;                 /* ←セル余白を消す */
  height: 54px;               /* 見やすい行高 */
  vertical-align: middle;
}

/* ヘッダ行 */
.outing-table thead th {
  background: #244a73;
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  padding: 10px 10px;
  text-align: left;
  position: sticky; /* スクロールしてもヘッダー列を固定表示 */
  top: 0;
  z-index: 5;
  box-shadow: inset 0 -1px 0 #c9d4e3; /* collapse境界線がスクロール時に消えるのを防ぐ */
}

/* ヘッダー短縮テキスト切替（デフォルトはフル表示） */
.th-short { display: none; }

/* 列幅（重要：行先を最大に、ホワイトボードに合わせる） */
.col-name {
  width: 100px;  /* 人員：狭く */
}

.col-department {
  width: 80px;  /* 部署：コンパクト */
}

.department-cell {
  padding: 0 8px !important;
  font-weight: 600;
  font-size: 14px;
  color: #4a5568;
  background: #f7f9fc;
  white-space: nowrap;
  text-align: center;
}

.col-destination {
  width: auto;  /* 行先：残り全部 */
}

.col-location {
  width: 130px;  /* 所在地：トグル3択が収まる幅 */
}

.col-ext {
  width: 70px;  /* 内線：3桁番号 */
}

.ext-cell .cell-input {
  text-align: center;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.05em;
}

.col-date {
  width: 130px;  /* 出社日：日付ピッカー用に少し広く */
}

.col-time {
  width: 100px;  /* 帰社時刻：狭く */
}

.col-note {
  width: 200px;  /* 備考：中くらい */
}

.col-action {
  width: 80px;  /* 操作：最小限 */
}

/* ========================================
   名前セル（大きく、濃く、太く）
   ======================================== */
.name-cell {
  padding: 0 8px !important;  /* 狭い列幅に合わせて調整 */
  font-weight: 800;
  font-size: 18px;  /* 少し小さく */
  color: #0b1f3a;
  background: #f7f9fc;
  white-space: nowrap;
  text-align: center;  /* 中央寄せ */
}

/* ========================================
   inputを"セル編集"風にする
   ======================================== */
.cell-input {
  width: 100%;
  height: 54px;
  border: 0;                 /* 箱を消す */
  outline: none;
  padding: 0 10px;           /* 最低限 */
  font-size: 16px;
  background: transparent;   /* セル背景を活かす */
  color: #0b1f3a;
  font-family: inherit;
}

/* 行先を大きく */
.cell-input.destination {
  font-size: 18px;
  font-weight: 650;
}

/* 日付セル（出社日） */
.date-cell .cell-input {
  text-align: center;
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  cursor: pointer;
}

/* 時刻は中央寄せでコンパクト */
.time-cell .cell-input {
  text-align: center;
  font-variant-numeric: tabular-nums;
}

/* 備考 */
.note-cell .cell-input {
  font-size: 16px;
}

/* ========================================
   所在地トグルボタン（1セル1ボタン巡回式）
   ======================================== */
.location-cell {
  padding: 0 !important;
  text-align: center;
  vertical-align: middle;
}

.loc-cycle-btn {
  width: 100%;
  height: 54px;
  border: 0;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.15s ease;
  letter-spacing: 0.05em;
  background: transparent;
  color: #aab4c2;
}

/* 本社工場 - 青系（優しいトーン） */
.loc-cycle-btn[data-loc="本社工場"] {
  background: #dbeafe;
  color: #1e40af;
}

/* 新工場 - 緑系（優しいトーン） */
.loc-cycle-btn[data-loc="新工場"] {
  background: #dcfce7;
  color: #166534;
}

/* 外出 - オレンジ系（優しいトーン） */
.loc-cycle-btn[data-loc="外出"] {
  background: #ffedd5;
  color: #9a3412;
}

/* 休み - グレー系（優しいトーン） */
.loc-cycle-btn[data-loc="休み"] {
  background: #f1f5f9;
  color: #475569;
}

/* ========================================
   時計型タイムピッカー
   ======================================== */
.clock-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
.clock-overlay.hidden { display: none; }

.clock-dialog {
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 12px 40px rgba(0,0,0,.25);
  width: 300px;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

.clock-header {
  background: #244a73;
  color: #fff;
  padding: 16px 20px;
  text-align: center;
}

.clock-header-time {
  font-size: 40px;
  font-weight: 800;
  letter-spacing: 0.02em;
}

.clock-header-time .clock-h,
.clock-header-time .clock-m {
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 6px;
}

.clock-header-time .clock-h.is-active,
.clock-header-time .clock-m.is-active {
  background: rgba(255,255,255,.25);
}

.clock-header-label {
  font-size: 13px;
  margin-top: 4px;
  opacity: 0.7;
}

.clock-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.clock-face {
  position: relative;
  width: 240px;
  height: 240px;
  border-radius: 50%;
  background: #f0f2f5;
  margin-bottom: 16px;
}

.clock-number {
  position: absolute;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-size: 15px;
  font-weight: 700;
  color: #0b1f3a;
  cursor: pointer;
  transition: all 0.12s ease;
}

.clock-number:hover {
  background: rgba(36,74,115,.1);
}

.clock-number.is-selected {
  background: #244a73;
  color: #fff;
}

.clock-hand {
  position: absolute;
  bottom: 50%;
  left: 50%;
  width: 2px;
  background: #244a73;
  transform-origin: bottom center;
  border-radius: 2px;
  pointer-events: none;
}

.clock-center-dot {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 8px;
  height: 8px;
  background: #244a73;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

.clock-footer {
  display: flex;
  justify-content: space-between;
  padding: 12px 20px 16px;
}

.clock-footer-btn {
  border: none;
  background: transparent;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  padding: 12px 20px;
  border-radius: 8px;
  transition: background 0.15s;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  min-height: 44px;
}

.clock-footer-btn:hover {
  background: #f0f2f5;
}

.clock-footer-btn.primary {
  background: #244a73;
  color: #fff;
}

.clock-footer-btn.primary:hover {
  background: #1d3d5f;
}

.clock-footer-btn.danger {
  color: #d9534f;
}

/* 時刻表示セル（タップで時計を開く） */
.time-display {
  width: 100%;
  height: 54px;
  border: 0;
  background: transparent;
  font-size: 16px;
  font-weight: 700;
  text-align: center;
  cursor: pointer;
  color: #0b1f3a;
  font-variant-numeric: tabular-nums;
}

.time-display:empty::after {
  content: '';
}

/* フォーカス時だけ薄く強調（スプレッドシートっぽく） */
.outing-table td:focus-within {
  background: #eef6ff;
  box-shadow: inset 0 0 0 2px #6aa4ff;
}

/* ========================================
   行の色分け（所在地に連動）
   ======================================== */
.row-loc-honsha td,
.row-loc-honsha th {
  background: #dbeafe !important;
}
.row-loc-honsha td:focus-within {
  background: #bfdbfe !important;
  box-shadow: inset 0 0 0 2px #6aa4ff;
}

.row-loc-shin td,
.row-loc-shin th {
  background: #dcfce7 !important;
}
.row-loc-shin td:focus-within {
  background: #bbf7d0 !important;
  box-shadow: inset 0 0 0 2px #6aa4ff;
}

.row-loc-out td,
.row-loc-out th {
  background: #ffedd5 !important;
}
.row-loc-out td:focus-within {
  background: #fed7aa !important;
  box-shadow: inset 0 0 0 2px #6aa4ff;
}

.row-loc-off td,
.row-loc-off th {
  background: #f1f5f9 !important;
}
.row-loc-off td:focus-within {
  background: #e2e8f0 !important;
  box-shadow: inset 0 0 0 2px #6aa4ff;
}

.row-none td,
.row-none th {
  background: #fff;
}

.row-empty td,
.row-empty th {
  background: #f7f9fc;
  opacity: 0.6;
}

/* 保存中の行 */
.row-saving {
  opacity: 0.7;
  pointer-events: none;
}

/* ========================================
   操作ボタン（クリア）
   ======================================== */
.action-cell {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 4px !important;
}

.clear-btn {
  width: 100%;
  height: 46px;
  border: 0;
  color: #fff;
  font-weight: 700;
  cursor: pointer;
  font-size: 14px;
  transition: background 0.2s;
  border-radius: 4px;
  background: #d9534f;
}

.clear-btn:hover:not(:disabled) {
  background: #c9302c;
}

.clear-btn:disabled {
  background: #f5a9a6;
  cursor: not-allowed;
}

/* ========================================
   確認ダイアログ
   ======================================== */
.confirm-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10000;
}
.confirm-overlay.hidden { display: none; }

.confirm-dialog {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 12px 40px rgba(0,0,0,.25);
  width: 320px;
  overflow: hidden;
  text-align: center;
}
.confirm-dialog-body {
  padding: 24px 20px 16px;
  font-size: 14px;
  line-height: 1.6;
  color: #333;
  white-space: pre-line;
}
.confirm-dialog-buttons {
  display: flex;
  border-top: 1px solid #e0e0e0;
}
.confirm-dialog-buttons button {
  flex: 1;
  padding: 14px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}
.confirm-dialog-buttons .confirm-cancel {
  background: #f5f5f5;
  color: #666;
}
.confirm-dialog-buttons .confirm-cancel:hover {
  background: #e8e8e8;
}
.confirm-dialog-buttons .confirm-ok {
  background: #d9534f;
  color: #fff;
}
.confirm-dialog-buttons .confirm-ok:hover {
  background: #c9302c;
}

/* ========================================
   凡例とクリアボタン
   ======================================== */
.legend-container {
  padding: 16px 20px;
  background: #fff;
  border-top: 1px solid #c9d4e3;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  flex: 0 0 auto; /* 下部固定 */
}

.legend {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  font-size: 0.85rem;
  color: #666;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
}

.legend-color {
  width: 20px;
  height: 20px;
  border-radius: 4px;
  border: 1px solid rgba(0,0,0,0.1);
}

.legend-loc-honsha {
  background-color: #dbeafe;
}
.legend-loc-shin {
  background-color: #dcfce7;
}
.legend-loc-out {
  background-color: #ffedd5;
}
.legend-loc-off {
  background-color: #f1f5f9;
}

/* ========================================
   アニメーション
   ======================================== */
.fade-in {
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.row-updated {
  animation: highlightRow 1s ease;
}

@keyframes highlightRow {
  0% { background-color: #bee3f8 !important; }
  100% { background-color: inherit !important; }
}

/* ========================================
   編集トグル
   ======================================== */
.edit-toggle-bar {
  background: #fff;
  padding: 8px 20px;
  border-bottom: 1px solid #e2e8f0;
  display: flex;
  align-items: center;
  flex: 0 0 auto; /* 固定 */
}

.edit-toggle {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}

.edit-toggle input { display: none; }

.edit-toggle__slider {
  position: relative;
  width: 44px;
  height: 24px;
  background: #cbd5e0;
  border-radius: 12px;
  transition: background 0.2s;
}

.edit-toggle__slider::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  background: #fff;
  border-radius: 50%;
  transition: transform 0.2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}

.edit-toggle input:checked + .edit-toggle__slider {
  background: #2f9e44;
}

.edit-toggle input:checked + .edit-toggle__slider::after {
  transform: translateX(20px);
}

.edit-toggle__label {
  font-size: 14px;
  font-weight: 600;
  color: #4a5568;
}

/* 編集ロック状態 */
.edit-locked .cell-input,
.edit-locked .loc-cycle-btn,
.edit-locked .time-display {
  pointer-events: none;
}

/* ========================================
   レスポンシブ
   ======================================== */

/* --- 横スクロール救済（案C） --- */
.outing-table {
  min-width: 1140px; /* 固定列計820px＋行先320px を確保。狭い端末では横スクロール */
}

/* --- タブレット（ヘッダー短縮・省略表示のみ、列幅は変更なし） --- */
@media (max-width: 1024px) {
  /* ヘッダー短縮テキスト */
  .col-date .th-full,
  .col-time .th-full,
  .col-note .th-full    { display: none; }
  .col-date .th-short,
  .col-time .th-short,
  .col-note .th-short   { display: inline; }

  /* 備考セルを省略表示 */
  .note-cell .cell-input {
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
  }
}

/* --- スマホ --- */
@media (max-width: 768px) {
  .header {
    padding: 12px 16px;
  }

  .title {
    font-size: 18px;
  }

  .outing-table th,
  .outing-table td {
    height: 48px;
  }

  .cell-input {
    height: 48px;
    font-size: 14px;
    padding: 0 8px;
  }

  .cell-input.destination {
    font-size: 16px;
  }

  .name-cell {
    font-size: 16px;
    padding: 0 8px !important;
