<script>
/**
 * 外出記入板 フロントエンドJS
 * A+C+B 保存方式実装
 * A: Draft (localStorage即座保存)
 * C: ChangeQueue (変更キュー)
 * B: Backend (遅延サーバー保存)
 */

// ========================================
// A層: DraftStore (ローカル保存)
// ========================================
const DraftStore = (function() {
  const STORAGE_KEY_PREFIX = 'outingBoard_draft_';
  const STORAGE_VERSION = 'v1';

  function getStorageKey(date) {
    return `${STORAGE_KEY_PREFIX}${STORAGE_VERSION}_${date}`;
  }

  function saveDraft(date, rowIndex, fieldName, value) {
    try {
      const key = getStorageKey(date);
      const drafts = loadAllDrafts(date);

      if (!drafts[rowIndex]) {
        drafts[rowIndex] = {};
      }

      drafts[rowIndex][fieldName] = value;
      drafts[rowIndex]._timestamp = Date.now();

      localStorage.setItem(key, JSON.stringify(drafts));
      return true;
    } catch (e) {
      console.error('Failed to save draft:', e);
      return false;
    }
  }

  function loadAllDrafts(date) {
    try {
      const key = getStorageKey(date);
      const data = localStorage.getItem(key);
      return data ? JSON.parse(data) : {};
    } catch (e) {
      console.error('Failed to load drafts:', e);
      return {};
    }
  }

  function loadRowDraft(date, rowIndex) {
    const drafts = loadAllDrafts(date);
    return drafts[rowIndex] || null;
  }

  function clearDraft(date, rowIndex) {
    try {
      const key = getStorageKey(date);
      const drafts = loadAllDrafts(date);
      delete drafts[rowIndex];

      if (Object.keys(drafts).length === 0) {
        localStorage.removeItem(key);
      } else {
        localStorage.setItem(key, JSON.stringify(drafts));
      }
      return true;
    } catch (e) {
      console.error('Failed to clear draft:', e);
      return false;
    }
  }

  function clearAllDrafts(date) {
    try {
      const key = getStorageKey(date);
      localStorage.removeItem(key);
      return true;
    } catch (e) {
      console.error('Failed to clear all drafts:', e);
      return false;
    }
  }

  function hasDrafts(date) {
    const drafts = loadAllDrafts(date);
    return Object.keys(drafts).length > 0;
  }

  return {
    saveDraft,
    loadAllDrafts,
    loadRowDraft,
    clearDraft,
    clearAllDrafts,
    hasDrafts
  };
})();

// ========================================
// C層: ChangeQueue (変更キュー)
// ========================================
const ChangeQueue = (function() {
  let queue = {}; // {rowIndex: {destination: 'xxx', startTime: 'xxx', ...}}
  let pendingSave = null;

  function addChange(rowIndex, fieldName, value) {
    if (!queue[rowIndex]) {
      queue[rowIndex] = { rowIndex };
    }
    queue[rowIndex][fieldName] = value;
  }

  function getChanges() {
    return Object.values(queue);
  }

  function hasChanges() {
    return Object.keys(queue).length > 0;
  }

  function clearChanges() {
    queue = {};
  }

  function clearRowChanges(rowIndex) {
    delete queue[rowIndex];
  }

  function setPendingSave(timeoutId) {
    if (pendingSave) {
      clearTimeout(pendingSave);
    }
    pendingSave = timeoutId;
  }

  function clearPendingSave() {
    if (pendingSave) {
      clearTimeout(pendingSave);
      pendingSave = null;
    }
  }

  return {
    addChange,
    getChanges,
    hasChanges,
    clearChanges,
    clearRowChanges,
    setPendingSave,
    clearPendingSave
  };
})();

// ========================================
// SaveManager: A+C+B 統合管理
// ========================================
const SaveManager = (function() {
  const AUTO_SAVE_DELAY = 3000; // 3秒
  const PERIODIC_SAVE_INTERVAL = 30000; // 30秒
  let periodicSaveTimer = null;
  let saveStatus = 'saved'; // 'saved' | 'saving' | 'unsaved' | 'error' | 'offline'
  let isSaving = false;

  function init() {
    // 定期保存タイマー開始
    startPeriodicSave();

    // ページ離脱時に保存
    window.addEventListener('beforeunload', function(e) {
      if (ChangeQueue.hasChanges()) {
        flushChanges();
        // ブラウザに警告を表示
        e.preventDefault();
        e.returnValue = '保存されていない変更があります';
      }
    });

    // オンライン/オフライン検出
    window.addEventListener('online', function() {
      console.log('オンラインに復帰しました');
      updateSaveStatus('unsaved');
      if (ChangeQueue.hasChanges()) {
        scheduleSave();
      }
    });

    window.addEventListener('offline', function() {
      console.log('オフラインになりました');
      updateSaveStatus('offline');
    });
  }

  function startPeriodicSave() {
    if (periodicSaveTimer) {
      clearInterval(periodicSaveTimer);
    }
    periodicSaveTimer = setInterval(function() {
      if (ChangeQueue.hasChanges() && !isSaving) {
        console.log('定期保存を実行します');
        flushChanges();
      }
    }, PERIODIC_SAVE_INTERVAL);
  }

  function onInputChange(date, rowIndex, fieldName, value) {
    // A層: 即座にlocalStorageに保存
    DraftStore.saveDraft(date, rowIndex, fieldName, value);

    // C層: 変更キューに追加
    ChangeQueue.addChange(rowIndex, fieldName, value);

    // 行の色分けをリアルタイム更新（所在地変更時）
    if (fieldName === 'location') {
      updateRowColorByLocation(rowIndex, value);
    }

    // 保存スケジュール
    updateSaveStatus('unsaved');
    scheduleSave();
  }

  /** 所在地の値から行クラスを即座に反映 */
  function updateRowColorByLocation(rowIndex, location) {
    var tr = elements.tableBody.querySelector('tr[data-row-index="' + rowIndex + '"]');
    if (!tr) return;

    var name = tr.querySelector('.name-cell') ? tr.querySelector('.name-cell').textContent.trim() : '';
    if (!name) {
      tr.className = 'row-empty';
      return;
    }

    var loc = (location || '').trim();
    tr.className = LOC_ROW_CLASS[loc] || 'row-none';
  }

  function scheduleSave() {
    // 既存のタイマーをキャンセル
    ChangeQueue.clearPendingSave();

    // 新しいタイマーをセット（デバウンス）
    const timeoutId = setTimeout(function() {
      flushChanges();
    }, AUTO_SAVE_DELAY);

    ChangeQueue.setPendingSave(timeoutId);
  }

  function flushChanges() {
    if (!ChangeQueue.hasChanges() || isSaving) {
      return;
    }

    // オフライン時は保存しない
    if (!navigator.onLine) {
      updateSaveStatus('offline');
      return;
    }

    isSaving = true;
    updateSaveStatus('saving');

    const changes = ChangeQueue.getChanges();
    const date = window.currentDate; // グローバルから取得

    console.log('サーバーに保存します:', changes);

    // B層: サーバーに一括送信
    google.script.run
      .withSuccessHandler(function(results) {
        onSaveSuccess(results);
      })
      .withFailureHandler(function(error) {
        onSaveError(error);
      })
      .api_applyPatch(date, changes);
  }

  function onSaveSuccess(results) {
    console.log('保存成功:', results);
    isSaving = false;

    // 保存成功した行のドラフトをクリア
    results.forEach(function(result) {
      if (result.success) {
        DraftStore.clearDraft(window.currentDate, result.rowIndex);
        ChangeQueue.clearRowChanges(result.rowIndex);

        // UI更新
        const tr = document.querySelector(`tr[data-row-index="${result.rowIndex}"]`);
        if (tr && result.row) {
          window.updateRowDisplay(tr, result.row);
        }
      }
    });

    // すべて成功したらキューをクリア
    if (results.every(r => r.success)) {
      ChangeQueue.clearChanges();
      updateSaveStatus('saved');
    } else {
      updateSaveStatus('error');
    }
  }

  function onSaveError(error) {
    console.error('保存エラー:', error);
    isSaving = false;
    updateSaveStatus('error');

    // リトライ（30秒後）
    setTimeout(function() {
      if (ChangeQueue.hasChanges()) {
        flushChanges();
      }
    }, 30000);
  }

  function updateSaveStatus(status) {
    saveStatus = status;

    const statusEl = document.getElementById('saveStatus');
    if (!statusEl) return;

    const messages = {
      'saved': '保存済み',
      'saving': '保存中...',
      'unsaved': '未保存',
      'error': '保存失敗',
      'offline': 'オフライン'
    };

    const classes = {
      'saved': 'save-status-saved',
      'saving': 'save-status-saving',
      'unsaved': 'save-status-unsaved',
      'error': 'save-status-error',
      'offline': 'save-status-offline'
    };

    statusEl.textContent = messages[status] || '';
    statusEl.className = 'save-status ' + (classes[status] || '');
  }

  function manualSave() {
    if (ChangeQueue.hasChanges()) {
      ChangeQueue.clearPendingSave();
      flushChanges();
    }
  }

  return {
    init,
    onInputChange,
    manualSave,
    flushChanges
  };
})();

// ========================================
// メインアプリケーション
// ========================================
(function() {
  'use strict';

  // ========================================
  // 状態管理
  // ========================================
  let currentDate = INITIAL_DATE;
  let currentData = null;

  // ========================================
  // DOM要素
  // ========================================
  const elements = {
    dateInput: null,
    reloadBtn: null,
    clearAllBtn: null,
    statusMessage: null,
    loading: null,
    tableContainer: null,
    tableBody: null
  };

  // ========================================
  // 初期化
  // ========================================
  document.addEventListener('DOMContentLoaded', init);

  function init() {
    // DOM要素を取得
    elements.dateInput = document.getElementById('dateInput');
    elements.reloadBtn = document.getElementById('reloadBtn');
    elements.clearAllBtn = document.getElementById('clearAllBtn');
    elements.statusMessage = document.getElementById('statusMessage');
    elements.loading = document.getElementById('loading');
    elements.tableContainer = document.getElementById('tableContainer');
    elements.tableBody = document.getElementById('tableBody');

    // 日付入力を初期化
    elements.dateInput.value = currentDate;

    // グローバルアクセス用
    window.currentDate = currentDate;
    window.updateRowDisplay = updateRowDisplay;

    // 編集トグル
    var editToggle = document.getElementById('editToggle');
    var editToggleLabel = document.getElementById('editToggleLabel');
    editToggle.addEventListener('change', function() {
      var locked = !editToggle.checked;
      elements.tableContainer.classList.toggle('edit-locked', locked);
      editToggleLabel.textContent = locked ? '読み取り専用' : '編集可能';
    });

    // イベントリスナー
    elements.dateInput.addEventListener('change', onDateChange);
    elements.reloadBtn.addEventListener('click', loadData);
    elements.clearAllBtn.addEventListener('click', clearAllRows);

    // A+C+B SaveManager初期化
    SaveManager.init();

    // 初期データ読み込み
    loadData();
  }

  // ========================================
  // データ読み込み
  // ========================================
  function loadData() {
    showLoading(true);
    hideStatus();

    google.script.run
      .withSuccessHandler(onDataLoaded)
      .withFailureHandler(onError)
      .getDayData(currentDate);
  }

  function onDataLoaded(data) {
    currentData = data;
    renderTable(data.rows);

    // 編集トグルをOFFにリセット
    var editToggle = document.getElementById('editToggle');
    var editToggleLabel = document.getElementById('editToggleLabel');
    editToggle.checked = false;
    editToggleLabel.textContent = '読み取り専用';
    elements.tableContainer.classList.add('edit-locked');

    // クラッシュリカバリ: ドラフトを復元
    restoreDrafts(data.rows);

    showLoading(false);
    showStatus('データを読み込みました', 'success', 2000);
  }

  // ========================================
  // クラッシュリカバリ: ドラフト復元
  // ========================================
  function restoreDrafts(rows) {
    const drafts = DraftStore.loadAllDrafts(currentDate);

    rows.forEach(function(row) {
      const draft = drafts[row.rowIndex];
      if (draft) {
        const tr = elements.tableBody.querySelector(`tr[data-row-index="${row.rowIndex}"]`);
        if (tr) {
          const inputs = tr.querySelectorAll('input');

          // ドラフトの値で上書き
          if (draft.extension !== undefined) {
            inputs[0].value = draft.extension;
            ChangeQueue.addChange(row.rowIndex, 'extension', draft.extension);
          }
          if (draft.destination !== undefined) {
            inputs[1].value = draft.destination;
            ChangeQueue.addChange(row.rowIndex, 'destination', draft.destination);
          }
          if (draft.location !== undefined) {
            // 所在地ボタンの復元
            const locBtn = tr.querySelector('.loc-cycle-btn');
            if (locBtn) { setLocBtnState(locBtn, draft.location); }
            ChangeQueue.addChange(row.rowIndex, 'location', draft.location);
          }
          if (draft.startTime !== undefined) {
            inputs[2].value = draft.startTime;
            ChangeQueue.addChange(row.rowIndex, 'startTime', draft.startTime);
          }
          if (draft.endTime !== undefined) {
            inputs[3].value = draft.endTime;
            var timeDisp = tr.querySelector('.time-display');
            if (timeDisp) { timeDisp.textContent = draft.endTime; }
            ChangeQueue.addChange(row.rowIndex, 'endTime', draft.endTime);
          }
          if (draft.note !== undefined) {
            inputs[4].value = draft.note;
            ChangeQueue.addChange(row.rowIndex, 'note', draft.note);
          }

          console.log(`ドラフトを復元しました: 行${row.rowIndex}`);
        }
      }
    });

    // ドラフトがある場合は自動保存をスケジュール
    if (ChangeQueue.hasChanges()) {
      SaveManager.flushChanges();
    }
  }

  // ========================================
  // 日付変更
  // ========================================
  function onDateChange(e) {
    currentDate = e.target.value;
    window.currentDate = currentDate; // グローバル更新
    loadData();
  }

  // ========================================
  // テーブル描画
  // ========================================
  function renderTable(rows) {
    elements.tableBody.innerHTML = '';

    rows.forEach(row => {
      const tr = createTableRow(row);
      // 名前がない行は非表示（ホワイトボードに合わせる）
      if (tr) {
        elements.tableBody.appendChild(tr);
      }
    });

    elements.tableContainer.classList.remove('hidden');
    elements.tableContainer.classList.add('fade-in');
  }

  function createTableRow(row) {
    // 名前がない行はスキップ（ホワイトボードに合わせる）
    if (!row.name || row.name.trim() === '') {
      return null;
    }

    const tr = document.createElement('tr');
    tr.dataset.rowIndex = row.rowIndex;

    // ステータスに応じたクラス
    tr.className = getRowClass(row);

    // 名前セル（編集不可）
    const nameTd = document.createElement('td');
    nameTd.className = 'name-cell';
    nameTd.textContent = row.name || '';
    tr.appendChild(nameTd);

    // 所在地（トグルボタン）
    tr.appendChild(createLocationCell(row.location));

    // 内線番号（3桁）
    tr.appendChild(createInputCell('extension', row.extension || '', '', 'ext-cell'));

    // 行先（プレースホルダなし、cell-input + destination）
    tr.appendChild(createInputCell('destination', row.destination, '', 'destination'));

    // 出社日（日付ピッカー、date-cell）
    tr.appendChild(createDateInputCell('startTime', row.startTime, 'date-cell'));

    // 帰社時刻（時刻入力、time-cell）
    tr.appendChild(createTimeInputCell('endTime', row.endTime, 'time-cell'));

    // 備考（プレースホルダなし、note-cell）
    tr.appendChild(createInputCell('note', row.note, '', 'note-cell'));

    // 操作ボタン（保存・クリア）
    const actionTd = document.createElement('td');
    actionTd.className = 'action-cell';

    const saveBtn = document.createElement('button');
    saveBtn.className = 'save-btn';
    saveBtn.textContent = '保存';
    saveBtn.addEventListener('click', () => {
      // A+C+B: 即座に保存（デバウンスをスキップ）
      SaveManager.manualSave();
    });
    actionTd.appendChild(saveBtn);

    const clearBtn = document.createElement('button');
    clearBtn.className = 'clear-btn';
    clearBtn.textContent = 'クリア';
    clearBtn.addEventListener('click', () => clearRow(row.rowIndex));
    actionTd.appendChild(clearBtn);

    tr.appendChild(actionTd);

    return tr;
  }

  // 所在地の巡回順序: 空 → 本社工場 → 新工場 → 外出 → 休み → 空 → …
  const LOC_CYCLE = ['', '本社工場', '新工場', '外出', '休み'];
  const LOC_LABELS = { '': '—', '本社工場': '本社工場', '新工場': '新工場', '外出': '外出', '休み': '休み' };

  function createLocationCell(currentValue) {
    const td = document.createElement('td');
    td.className = 'location-cell';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'loc-cycle-btn';
    setLocBtnState(btn, currentValue || '');

    btn.addEventListener('click', function(e) {
      const tr = e.target.closest('tr');
      const rowIndex = parseInt(tr.dataset.rowIndex);
      const cur = btn.dataset.loc || '';
      const idx = LOC_CYCLE.indexOf(cur);
      const next = LOC_CYCLE[(idx + 1) % LOC_CYCLE.length];
      setLocBtnState(btn, next);
      SaveManager.onInputChange(currentDate, rowIndex, 'location', next);
    });

    td.appendChild(btn);
    return td;
  }

  function setLocBtnState(btn, value) {
    btn.dataset.loc = value;
    btn.textContent = LOC_LABELS[value] || '—';
  }

  function createInputCell(fieldName, value, placeholder, tdClass) {
    const td = document.createElement('td');
    if (tdClass) {
      td.className = tdClass;
    }

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'cell-input' + (fieldName === 'destination' ? ' destination' : '');
    input.name = fieldName;
    input.value = value || '';
    if (placeholder) {
      input.placeholder = placeholder;
    }

    // A+C+B: 入力時に即座に保存（auto-save）
    input.addEventListener('input', (e) => {
      const row = e.target.closest('tr');
      const rowIndex = parseInt(row.dataset.rowIndex);
      SaveManager.onInputChange(currentDate, rowIndex, fieldName, e.target.value);
    });

    // Enterキーで即座に保存
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        SaveManager.manualSave();
      }
    });

    td.appendChild(input);
    return td;
  }

  function createDateInputCell(fieldName, value, tdClass) {
    const td = document.createElement('td');
    if (tdClass) {
      td.className = tdClass;
    }

    const input = document.createElement('input');
    input.type = 'date';  // 日付ピッカー
    input.className = 'cell-input';
    input.name = fieldName;
    input.value = value || '';

    // A+C+B: 入力時に即座に保存（auto-save）
    input.addEventListener('input', (e) => {
      const row = e.target.closest('tr');
      const rowIndex = parseInt(row.dataset.rowIndex);
      SaveManager.onInputChange(currentDate, rowIndex, fieldName, e.target.value);
    });

    input.addEventListener('change', (e) => {
      const row = e.target.closest('tr');
      const rowIndex = parseInt(row.dataset.rowIndex);
      SaveManager.onInputChange(currentDate, rowIndex, fieldName, e.target.value);
    });

    // Enterキーで即座に保存
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        SaveManager.manualSave();
      }
    });

    td.appendChild(input);
    return td;
  }

  function createTimeInputCell(fieldName, value, tdClass) {
    const td = document.createElement('td');
    if (tdClass) {
      td.className = tdClass;
    }

    // 隠しinput（データ保持用）
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = fieldName;
    input.value = value || '';
    td.appendChild(input);

    // 表示ボタン（タップで時計を開く）
    const display = document.createElement('button');
    display.type = 'button';
    display.className = 'time-display';
    display.textContent = value || '';

    display.addEventListener('click', function() {
      const tr = td.closest('tr');
      const rowIndex = parseInt(tr.dataset.rowIndex);
      openClockPicker(input.value, function(newVal) {
        input.value = newVal;
        display.textContent = newVal;
        SaveManager.onInputChange(currentDate, rowIndex, fieldName, newVal);
      }, function() {
        // クリア
        input.value = '';
        display.textContent = '';
        SaveManager.onInputChange(currentDate, rowIndex, fieldName, '');
      });
    });

    td.appendChild(display);
    return td;
  }

  // ========================================
  // 時計型タイムピッカー
  // ========================================
  const ClockPicker = (function() {
    let overlay = null;
    let mode = 'hour'; // 'hour' | 'minute'
    let selectedHour = 17;
    let selectedMinute = 0;
    let onConfirm = null;
    let onClear = null;

    function init() {
      if (overlay) return;

      overlay = document.createElement('div');
      overlay.className = 'clock-overlay hidden';
      overlay.innerHTML = [
        '<div class="clock-dialog">',
        '  <div class="clock-header">',
        '    <div class="clock-header-time">',
        '      <span class="clock-h is-active" id="clockH">17</span>',
        '      <span>:</span>',
        '      <span class="clock-m" id="clockM">00</span>',
        '    </div>',
        '    <div class="clock-header-label" id="clockLabel">時を選択</div>',
        '  </div>',
        '  <div class="clock-body">',
        '    <div class="clock-face" id="clockFace">',
        '      <div class="clock-hand" id="clockHand"></div>',
        '      <div class="clock-center-dot"></div>',
        '    </div>',
        '  </div>',
        '  <div class="clock-footer">',
        '    <button class="clock-footer-btn danger" id="clockClear">クリア</button>',
        '    <div>',
        '      <button class="clock-footer-btn" id="clockCancel">キャンセル</button>',
        '      <button class="clock-footer-btn primary" id="clockOk">OK</button>',
        '    </div>',
        '  </div>',
        '</div>'
      ].join('');

      document.body.appendChild(overlay);

      // ヘッダーの時/分クリック
      document.getElementById('clockH').addEventListener('click', function() { switchMode('hour'); });
      document.getElementById('clockM').addEventListener('click', function() { switchMode('minute'); });

      // フッターボタン
      document.getElementById('clockCancel').addEventListener('click', function(e) {
        e.stopPropagation();
        close();
      });
      document.getElementById('clockOk').addEventListener('click', function(e) {
        e.stopPropagation();
        if (onConfirm) {
          var h = String(selectedHour).padStart(2, '0');
          var m = String(selectedMinute).padStart(2, '0');
          onConfirm(h + ':' + m);
        }
        close();
      });
      document.getElementById('clockClear').addEventListener('click', function(e) {
        e.stopPropagation();
        if (onClear) { onClear(); }
        close();
      });

      // オーバーレイ背景クリックで閉じる
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) { close(); }
      });
    }

    function open(currentValue, confirmCb, clearCb) {
      init();
      onConfirm = confirmCb;
      onClear = clearCb;

      // 初期値をパース
      if (currentValue && currentValue.match(/^(\d{1,2}):(\d{2})$/)) {
        selectedHour = parseInt(RegExp.$1);
        selectedMinute = parseInt(RegExp.$2);
      } else {
        selectedHour = 17;
        selectedMinute = 0;
      }

      mode = 'hour';
      updateDisplay();
      renderFace();
      overlay.classList.remove('hidden');
    }

    function close() {
      if (overlay) { overlay.classList.add('hidden'); }
    }

    function switchMode(m) {
      mode = m;
      updateDisplay();
      renderFace();
    }

    function updateDisplay() {
      var hEl = document.getElementById('clockH');
      var mEl = document.getElementById('clockM');
      var label = document.getElementById('clockLabel');

      hEl.textContent = String(selectedHour).padStart(2, '0');
      mEl.textContent = String(selectedMinute).padStart(2, '0');

      hEl.classList.toggle('is-active', mode === 'hour');
      mEl.classList.toggle('is-active', mode === 'minute');
      label.textContent = mode === 'hour' ? '時を選択' : '分を選択';
    }

    function renderFace() {
      var face = document.getElementById('clockFace');
      var hand = document.getElementById('clockHand');

      // 既存の数字を削除
      face.querySelectorAll('.clock-number').forEach(function(el) { el.remove(); });

      var numbers, selectedVal, count;

      if (mode === 'hour') {
        // 0〜23時を表示（外側0-11, 内側12-23）
        numbers = [];
        for (var i = 0; i < 12; i++) { numbers.push(i); }
        count = 12;
        selectedVal = selectedHour;

        // 外周: 0-11
        for (var n = 0; n < 12; n++) {
          var angle = (n * 30 - 90) * Math.PI / 180;
          var r = 96;
          var x = 120 + r * Math.cos(angle) - 20;
          var y = 120 + r * Math.sin(angle) - 20;

          var el = document.createElement('div');
          el.className = 'clock-number' + (selectedVal === n ? ' is-selected' : '');
          el.textContent = n;
          el.style.left = x + 'px';
          el.style.top = y + 'px';
          el.dataset.val = n;
          el.addEventListener('click', onNumberClick);
          face.appendChild(el);
        }

        // 内周: 12-23
        for (var n2 = 12; n2 < 24; n2++) {
          var angle2 = ((n2 - 12) * 30 - 90) * Math.PI / 180;
          var r2 = 62;
          var x2 = 120 + r2 * Math.cos(angle2) - 20;
          var y2 = 120 + r2 * Math.sin(angle2) - 20;

          var el2 = document.createElement('div');
          el2.className = 'clock-number' + (selectedVal === n2 ? ' is-selected' : '');
          el2.textContent = n2;
          el2.style.left = x2 + 'px';
          el2.style.top = y2 + 'px';
          el2.style.fontSize = '13px';
          el2.dataset.val = n2;
          el2.addEventListener('click', onNumberClick);
          face.appendChild(el2);
        }

        // 針の角度と長さ
        var hAngle = (selectedHour % 12) * 30;
        var hLen = selectedHour >= 12 ? 50 : 84;
        hand.style.height = hLen + 'px';
        hand.style.transform = 'translateX(-50%) rotate(' + hAngle + 'deg)';

      } else {
        // 分: 0,5,10,...55 を円形に配置
        for (var m = 0; m < 60; m += 5) {
          var angle3 = (m * 6 - 90) * Math.PI / 180;
          var r3 = 96;
          var x3 = 120 + r3 * Math.cos(angle3) - 20;
          var y3 = 120 + r3 * Math.sin(angle3) - 20;

          var el3 = document.createElement('div');
          el3.className = 'clock-number' + (selectedMinute === m ? ' is-selected' : '');
          el3.textContent = String(m).padStart(2, '0');
          el3.style.left = x3 + 'px';
          el3.style.top = y3 + 'px';
          el3.dataset.val = m;
          el3.addEventListener('click', onNumberClick);
          face.appendChild(el3);
        }

        var mAngle = selectedMinute * 6;
        hand.style.height = '84px';
        hand.style.transform = 'translateX(-50%) rotate(' + mAngle + 'deg)';
      }
    }

    function onNumberClick(e) {
      e.stopPropagation();
      var val = parseInt(e.target.dataset.val);
      if (mode === 'hour') {
        selectedHour = val;
        updateDisplay();
        renderFace();
        // 自動で分選択に移行
        setTimeout(function() { switchMode('minute'); }, 200);
      } else {
        selectedMinute = val;
        updateDisplay();
        renderFace();
      }
    }

    return { open: open };
  })();

  function openClockPicker(currentValue, onConfirm, onClear) {
    ClockPicker.open(currentValue, onConfirm, onClear);
  }

  // 所在地 → 行クラスのマッピング
  const LOC_ROW_CLASS = {
    '本社工場': 'row-loc-honsha',
    '新工場': 'row-loc-shin',
    '外出': 'row-loc-out',
    '休み': 'row-loc-off'
  };

  function getRowClass(row) {
    // 名前がない行は空行
    if (!row.name || row.name.trim() === '') {
      return 'row-empty';
    }

    // 所在地に応じた色分け
    var loc = (row.location || '').trim();
    return LOC_ROW_CLASS[loc] || 'row-none';
  }

  // ========================================
  // 時刻入力の自動整形
  // ========================================
  function formatTimeInput(value) {
    if (!value || value.trim() === '') {
      return '';
    }

    const trimmed = value.trim();

    // すでに正しい形式なら何もしない
    if (/^([01]?\d|2[0-3]):[0-5]\d$/.test(trimmed)) {
      // HH:MM形式に整形（1桁の時は0埋め）
      const match = trimmed.match(/^(\d{1,2}):(\d{2})$/);
      if (match) {
        const hours = match[1].padStart(2, '0');
        const minutes = match[2];
        return hours + ':' + minutes;
      }
      return trimmed;
    }

    // H:M形式（例: 9:5）を HH:MM に変換
    const match = trimmed.match(/^(\d{1,2}):(\d{1,2})$/);
    if (match) {
      const hours = parseInt(match[1]);
      const minutes = parseInt(match[2]);

      // 時間のバリデーション
      if (hours >= 0 && hours <= 23 && minutes >= 0 && minutes <= 59) {
        return hours.toString().padStart(2, '0') + ':' + minutes.toString().padStart(2, '0');
      }
    }

    // 整形できない場合はそのまま返す（バリデーションエラーは保存時に出す）
    return null;
  }

  // ========================================
  // 全行クリア
  // ========================================
  function clearAllRows() {
    if (!confirm('すべての行の情報をクリアしますか？（名前以外）\n\nこの操作は取り消せません。')) {
      return;
    }

    const rows = elements.tableBody.querySelectorAll('tr');
    if (rows.length === 0) {
      showStatus('クリアする行がありません', 'info', 2000);
      return;
    }

    // すべてクリアボタンを無効化
    elements.clearAllBtn.disabled = true;
    elements.clearAllBtn.textContent = 'クリア中...';

    // A+C+B: すべての行の値をクリア
    rows.forEach((tr) => {
      const rowIndex = parseInt(tr.dataset.rowIndex);
      const inputs = tr.querySelectorAll('input');

      // 入力フィールドを空にする
      inputs[0].value = '';  // 内線
      inputs[1].value = '';  // 行先
      inputs[2].value = '';  // 出社日
      inputs[3].value = '';  // 帰社時刻
      inputs[4].value = '';  // 備考

      // 時計表示もクリア
      const td1 = tr.querySelector('.time-display');
      if (td1) { td1.textContent = ''; }

      // 所在地をリセット
      const locBtn = tr.querySelector('.loc-cycle-btn');
      if (locBtn) { setLocBtnState(locBtn, ''); }

      // A+C+B: 変更をキューに追加
      SaveManager.onInputChange(currentDate, rowIndex, 'extension', '');
      SaveManager.onInputChange(currentDate, rowIndex, 'destination', '');
      SaveManager.onInputChange(currentDate, rowIndex, 'location', '');
      SaveManager.onInputChange(currentDate, rowIndex, 'startTime', '');
      SaveManager.onInputChange(currentDate, rowIndex, 'endTime', '');
      SaveManager.onInputChange(currentDate, rowIndex, 'note', '');
    });

    // 即座に保存
    SaveManager.manualSave();

    // ボタンを元に戻す
    setTimeout(() => {
      elements.clearAllBtn.disabled = false;
      elements.clearAllBtn.textContent = 'すべてクリア';
      showStatus('すべての行をクリアしました', 'success', 2000);
    }, 1000);
  }

  // ========================================
  // 行クリア
  // ========================================
  function clearRow(rowIndex) {
    if (!confirm('この行の情報をクリアしますか？（名前以外）')) {
      return;
    }

    const tr = elements.tableBody.querySelector(`tr[data-row-index="${rowIndex}"]`);
    if (!tr) return;

    // 入力フィールドを空にする
    const inputs = tr.querySelectorAll('input');
    inputs[0].value = '';  // 内線
    inputs[1].value = '';  // 行先
    inputs[2].value = '';  // 出社日
    inputs[3].value = '';  // 帰社時刻
    inputs[4].value = '';  // 備考

    // 時計表示もクリア
    const td2 = tr.querySelector('.time-display');
    if (td2) { td2.textContent = ''; }

    // 所在地をリセット
    const locBtn2 = tr.querySelector('.loc-cycle-btn');
    if (locBtn2) { setLocBtnState(locBtn2, ''); }

    // A+C+B: 空の値で各フィールドを更新
    SaveManager.onInputChange(currentDate, rowIndex, 'extension', '');
    SaveManager.onInputChange(currentDate, rowIndex, 'destination', '');
    SaveManager.onInputChange(currentDate, rowIndex, 'location', '');
    SaveManager.onInputChange(currentDate, rowIndex, 'startTime', '');
    SaveManager.onInputChange(currentDate, rowIndex, 'endTime', '');
    SaveManager.onInputChange(currentDate, rowIndex, 'note', '');

    // 即座に保存
    SaveManager.manualSave();
  }

  // ========================================
  // 行表示更新（A+C+B SaveManagerから使用）
  // ========================================
  function updateRowDisplay(tr, row) {
    // 入力値を更新
    const inputs = tr.querySelectorAll('input');
    inputs[0].value = row.extension || '';
    inputs[1].value = row.destination || '';
    inputs[2].value = row.startTime || '';
    inputs[3].value = row.endTime || '';
    inputs[4].value = row.note || '';

    // 時計表示ボタンのテキストも更新
    const timeDisplay = tr.querySelector('.time-display');
    if (timeDisplay) { timeDisplay.textContent = row.endTime || ''; }

    // 所在地ボタンを更新
    const locBtn = tr.querySelector('.loc-cycle-btn');
    if (locBtn) { setLocBtnState(locBtn, row.location || ''); }

    // クラスを更新
    tr.className = getRowClass(row);
  }

  // ========================================
  // クライアント側バリデーション
  // ========================================
  function validatePayload(payload) {
    const errors = [];

    // 出社日の形式チェック（YYYY-MM-DD）
    if (payload.startTime && !isValidDateFormat(payload.startTime)) {
      errors.push('出社日の形式が不正です（例: 2025-12-25）');
    }

    // 帰社時刻の形式チェック（HH:MM）
    if (payload.endTime && !isValidTimeFormat(payload.endTime)) {
      errors.push('帰社時刻の形式が不正です（例: 17:30 または 09:00）');
    }

    if (errors.length > 0) {
      return { valid: false, message: errors.join('\n') };
    }
    return { valid: true, message: '' };
  }

  function isValidDateFormat(dateStr) {
    if (!dateStr || dateStr.trim() === '') return true;
    // YYYY-MM-DD形式をチェック
    const pattern = /^\d{4}-\d{2}-\d{2}$/;
    if (!pattern.test(dateStr.trim())) return false;

    // 実際に有効な日付かチェック
    const date = new Date(dateStr);
    return !isNaN(date.getTime());
  }

  function isValidTimeFormat(timeStr) {
    if (!timeStr || timeStr.trim() === '') return true;
    const pattern = /^([0-9]|0[0-9]|1[0-9]|2[0-3]):([0-5][0-9])$/;
    return pattern.test(timeStr.trim());
  }

  function normalizeTime(timeStr) {
    if (!timeStr) return '';
    const match = timeStr.trim().match(/^(\d{1,2}):(\d{2})$/);
    if (!match) return timeStr;
    return match[1].padStart(2, '0') + ':' + match[2];
  }

  // ========================================
  // UI ヘルパー
  // ========================================
  function showLoading(show) {
    if (show) {
      elements.loading.classList.remove('hidden');
      elements.tableContainer.classList.add('hidden');
    } else {
      elements.loading.classList.add('hidden');
    }
  }

  function showStatus(message, type, autoHideMs) {
    elements.statusMessage.textContent = message;
    elements.statusMessage.className = 'status-message ' + type;
    elements.statusMessage.classList.remove('hidden');

    if (autoHideMs) {
      setTimeout(hideStatus, autoHideMs);
    }
  }

  function hideStatus() {
    elements.statusMessage.classList.add('hidden');
  }

  function onError(error) {
    showLoading(false);
    showStatus('エラー: ' + error.message, 'error');
    console.error('Error:', error);
  }

})();
</script>
