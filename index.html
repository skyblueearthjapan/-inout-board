<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base target="_top">
  <title>外出記入板</title>

<body>
  <div class="container">
    <!-- ヘッダー -->
    <header class="header">
      <div class="header-left">
        <div class="lineworks-logo">LINE WORKS</div>
        <h1 class="title">外出記入板</h1>
      </div>
      <div class="header-controls">
        <div class="save-status save-status-saved" id="saveStatus">保存済み</div>
        <div class="date-picker">
          <label for="dateInput">日付:</label>
          <input type="date" id="dateInput" />
        </div>
        <button id="reloadBtn" class="btn btn-secondary" title="再読込">
          <span class="btn-icon">↻</span> 再読込
        </button>
        <a href="<?= PORTAL_URL ?>" target="_top" class="portal-link">社内ポータルへ移動</a>
      </div>
    </header>
    
    <!-- ステータスメッセージ -->
    <div id="statusMessage" class="status-message hidden"></div>
    
    <!-- ローディング -->
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <span>読み込み中...</span>
    </div>
    
    <!-- 編集トグル -->
    <div class="edit-toggle-bar">
      <label class="edit-toggle">
        <input type="checkbox" id="editToggle" />
        <span class="edit-toggle__slider"></span>
        <span class="edit-toggle__label" id="editToggleLabel">読み取り専用</span>
      </label>
    </div>

    <!-- メインテーブル -->
    <div id="tableContainer" class="table-container hidden edit-locked">
      <table class="outing-table">
        <thead>
          <tr>
            <th class="col-name">人員</th>
            <th class="col-destination">行先</th>
            <th class="col-location">所在地</th>
            <th class="col-date"><span class="th-full">出社日</span><span class="th-short">出社</span></th>
            <th class="col-time"><span class="th-full">帰社時刻</span><span class="th-short">帰社</span></th>
            <th class="col-note"><span class="th-full">備考</span><span class="th-short">備考</span></th>
            <th class="col-action">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- 動的に生成 -->
        </tbody>
      </table>
    </div>
    
    <!-- 凡例とクリアボタン -->
    <div class="legend-container">
      <div class="legend">
        <div class="legend-item">
          <span class="legend-color legend-out"></span>
          <span>宿泊あり（出社日あり・帰社時刻なし）</span>
        </div>
        <div class="legend-item">
          <span class="legend-color legend-back"></span>
          <span>日帰り（帰社時刻あり）</span>
        </div>
      </div>
      <button id="clearAllBtn" class="btn btn-danger">すべてクリア</button>
    </div>
  </div>
